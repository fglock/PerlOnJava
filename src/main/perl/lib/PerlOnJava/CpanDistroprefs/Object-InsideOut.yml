---
comment: |
  Object::InsideOut uses a self-referential (??{}) regex to parse balanced
  attribute arguments. PerlOnJava can run the module with the documented
  unimplemented-feature warning fallback, but its upstream suite treats that
  diagnostic as a hard failure. Skip this dependency's upstream tests when it
  is pulled in by Logger::Simple; Logger::Simple remains the compatibility
  gate.
match:
  distribution: "^JDHEDDEN/Object-InsideOut-"
  env:
    PERLONJAVA_JCPAN_ARGS: "(^|[[:space:]])Logger::Simple($|[[:space:]])"
test:
  commandline: "PERLONJAVA_SKIP"
