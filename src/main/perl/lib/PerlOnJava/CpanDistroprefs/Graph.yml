---
comment: |
  PerlOnJava distroprefs for Graph.

  The former explicit-loop rewrites for `return` inside nested map blocks were
  retired after cached JVM method dispatch learned to consume the non-local
  return at the method that owns those blocks.

  The remaining patch isolates adjacency rendering without Set::Object map
  behavior.
match:
  distribution: "^.*/Graph-[0-9]"
patches:
  - "Graph/AdjacencyMap.pm.patch"
