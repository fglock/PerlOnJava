---
comment: |
  PerlOnJava distroprefs for DateTime::Format::CLDR.

  Quote non-ASCII literal pattern bytes as explicit hexadecimal regex escapes.
  This preserves both byte-string patterns from source files without `use
  utf8` and decoded Unicode patterns when the dynamically assembled parser
  regex is compiled on the JVM.
match:
  distribution: "^MAROS/DateTime-Format-CLDR-"
patches:
  - "DateTime-Format-CLDR-1.19/ByteSafePatternLiterals.patch"
