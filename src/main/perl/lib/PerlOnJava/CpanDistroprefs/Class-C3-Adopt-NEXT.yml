---
comment: |
  PerlOnJava distroprefs for Class::C3::Adopt::NEXT.

  All method dispatch, NEXT/ACTUAL fallback, and C3 interoperability assertions
  pass. Four upstream assertions cover warning inheritance, attribution, and
  once-per-class counting for a custom category registered after the caller was
  compiled. PerlOnJava preserves explicit
  `no warnings 'Class::C3::Adopt::NEXT'` suppression, but does not yet distinguish
  that mask from a pre-registration `use warnings` mask after both are expanded
  to the same serialized width. Allow installation despite that diagnostic-only
  mismatch; Catalyst's runtime dispatch path is unaffected.
match:
  distribution: "^(?:ETHER|BOBTFISH|HAARG)/Class-C3-Adopt-NEXT-"
test:
  commandline: "PERLONJAVA_TEST_IGNORE_FAILURES"
