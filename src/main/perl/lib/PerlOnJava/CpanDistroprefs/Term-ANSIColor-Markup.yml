---
comment: |
  PerlOnJava distroprefs for Term::ANSIColor::Markup.

  The distribution uses lvalue accessors only for two internal assignments,
  pulling in the XS-only Want module through Class::Accessor::Lvalue::Fast.
  Use ordinary Class::Accessor::Fast accessors and method-style setters instead.
  Also declare the Test::Base build dependency omitted by the old
  Module::Install metadata.
match:
  distribution: "^KENTARO/Term-ANSIColor-Markup-"
patches:
  - "Term-ANSIColor-Markup-0.06/PortableAccessors.patch"
