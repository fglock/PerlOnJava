---
comment: |
  PerlOnJava compatibility patch for Char::Latin2. The distribution rejects
  executables named `jperl` because that name historically referred to a
  different Japanese Perl implementation. Keep that guard while recognizing
  PerlOnJava through PERLONJAVA_EXECUTABLE. Delegate its regex-code-block source
  transformer to system Perl, use PerlOnJava's native split implementation,
  and replace runtime regex code blocks with bounded ordinary patterns already
  used by the supported Char::Latin7 and Char::Windows1258 ports.
match:
  distribution: "^.*/Char-Latin2-"
patches:
  - "Char-Latin2/PerlOnJavaExecutable.patch"
