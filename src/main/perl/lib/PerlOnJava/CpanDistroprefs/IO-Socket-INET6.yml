---
comment: |
  PerlOnJava distroprefs for IO::Socket::INET6 2.73.

  The distribution's blocking.t, io_sock6.t, and io_multihomed6.t tests
  create local client/server pairs with fork(). PerlOnJava does not implement
  POSIX fork(), so make their existing Config-based skip apply to installed
  CPAN builds as well as Perl core-tree builds. All non-fork IPv6 socket tests,
  including the UDP and listener tests, continue to run.
match:
  distribution: "IO-Socket-INET6-2\\.73"
patches:
  - "IO-Socket-INET6-2.73/SkipForkSocketTests.patch"
