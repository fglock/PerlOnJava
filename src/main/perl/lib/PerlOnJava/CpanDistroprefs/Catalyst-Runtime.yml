---
comment: |
  PerlOnJava distroprefs for Catalyst::Runtime.

  Catalyst::Runtime's t/live_fork.t exercises process spawning and POSIX
  fork(), which PerlOnJava does not implement. Patch that test alone to skip
  on PerlOnJava; leave every other upstream test enabled.
match:
  distribution: "^JJNAPIORK/Catalyst-Runtime-"
patches:
  - "Catalyst-Runtime/SkipLiveForkTest.patch"
