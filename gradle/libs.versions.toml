[versions]
asm = "9.10.1"
bouncycastle = "1.85"
commons-compress = "1.28.0"
commons-csv = "1.14.1"
commonmark = "0.29.0"
icu4j = "78.3"
jsoup = "1.23.1"
jing = "20241231"
junit-jupiter = "6.1.3"
snakeyaml-engine = "3.1.1"
snappy-java = "1.1.10.8"
sqlite-jdbc = "3.53.2.1"
tomlj = "1.1.1"
zstd-jni = "1.5.7-8"
zxing = "3.5.4"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcprov = "org.bouncycastle:bcprov-jdk18on:1.85.2"
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commons-csv" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-task-list = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jing = { module = "org.relaxng:jing", version.ref = "jing" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
cyclonedx = "org.cyclonedx.bom:2.3.0"
ospackage = "com.netflix.nebula.ospackage:12.3.0"
shadow = "com.gradleup.shadow:9.3.1"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
