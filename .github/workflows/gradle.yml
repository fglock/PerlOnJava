name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: build (${{ matrix.os }})
    timeout-minutes: 120

    # Define a matrix to run the job on multiple operating systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout source
        id: checkout-source
        timeout-minutes: 10
        uses: actions/checkout@v4

      - name: Set up JDK 24
        id: setup-java
        timeout-minutes: 10
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        id: setup-gradle
        timeout-minutes: 10
        uses: gradle/actions/setup-gradle@v4

      # Use Makefile's 'ci' target which handles platform differences
      # Both platforms build and run tests; Windows uses the non-daemon wrapper.
      - name: Build with Make (Windows)
        id: build-windows
        if: runner.os == 'Windows'
        timeout-minutes: 45
        shell: cmd
        run: make ci
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Run focused Perl thread gate (Windows)
        id: threads-windows
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: cmd
        run: make test-threads-windows
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build with Make (Linux)
        id: build-linux
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: make ci

      - name: Checkout latest Perl thread compatibility corpus
        id: checkout-perl5
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          repository: Perl/perl5
          path: perl5
          sparse-checkout: |
            t
            dist/threads
            dist/threads-shared
            dist/Thread-Queue
            dist/Thread-Semaphore

      - name: Run Perl thread compatibility gate
        id: threads-linux
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: make test-threads

      - name: Generate SBOM (Linux only)
        id: sbom-linux
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: make sbom

      - name: Upload SBOM artifacts
        id: upload-sbom
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            build/reports/sbom.json
          retention-days: 90

      - name: Upload test results
        id: upload-failure
        if: failure()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/threads/
            build/test-results/testThreadsWindows/
